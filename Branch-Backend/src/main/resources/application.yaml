spring:
  application:
    name: BranchMaster
  datasource:
    url: jdbc:mysql://localhost:3306/branch_master
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  data:
    web:
      pageable:
        max-page-size: 100000

branch:
  notification:
    email: ${BRANCH_NOTIFICATION_EMAIL}

server:
  port: 8081