spring:
  application:
    name: dropdown-service

  datasource:
    url: jdbc:mysql://localhost:3306/branch_master
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true

server:
  port: 8082